<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Excel ke Grafik</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* Layout: kartu unggah di atas; di bawahnya baris tab sheet (menempel, dikelompokkan per jenis periode) dan grid kartu grafik per tab.
     Warna: putih, tinta biru-tua, 2025 jingga, 2026 biru, seri lain dari palet yang sudah divalidasi. Satu tema terang sesuai permintaan. */
  :root {
    --bg: #FFFFFF;
    --ink: #0B1B33;
    --muted: #5B6B82;
    --line: #E2E8F0;
    --grid: #EDF1F6;
    --zero: #CBD5E1;
    --axis: #475569;
    --tint: #F6F8FB;
    --blue: #2563EB;
    --blue-ink: #1D4ED8;
    --blue-tint: #EEF3FF;
    --orange: #F97316;
    --err-bg: #FEF2F2;
    --err-line: #FCA5A5;
    --err-ink: #991B1B;
    --font: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font);
    font-size: 14px;
    padding-inline: clamp(16px, 3vw, 40px);
    padding-block: 26px 48px;
  }
  button { font-family: inherit; }
  .page { max-width: 1520px; margin-inline: auto; }

  .top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px 28px; }
  .intro { min-width: 0; }
  h1 { margin: 0; font-size: clamp(22px, 2.6vw, 28px); font-weight: 800; letter-spacing: -0.02em; }
  .lead { margin: 5px 0 0; max-width: 56ch; color: var(--muted); font-size: 13.5px; line-height: 1.5; font-weight: 500; }
  .upload {
    display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px;
    padding: 12px 14px 12px 18px; border: 1px solid var(--line); border-radius: 18px; background: var(--tint);
    min-width: 0; max-width: 100%;
  }
  .file { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; min-width: 0; }
  .fname { font-weight: 700; font-size: 13.5px; overflow-wrap: anywhere; }
  .badge { padding: 3px 9px; border-radius: 999px; background: var(--blue-tint); color: var(--blue-ink); font-size: 11.5px; font-weight: 700; }
  .fmeta { color: var(--muted); font-size: 12.5px; font-weight: 600; }
  .primary {
    padding: 10px 18px; border: 0; border-radius: 12px; background: var(--blue); color: #fff;
    font-size: 13.5px; font-weight: 700; cursor: pointer; transition: background .15s;
  }
  .primary:hover { background: var(--blue-ink); }
  .vh { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; pointer-events: none; }
  .tip { margin: 10px 2px 0; color: var(--muted); font-size: 12.5px; }
  #err {
    margin-top: 16px; padding: 14px 16px; border: 1px solid var(--err-line); border-radius: 12px;
    background: var(--err-bg); color: var(--err-ink); font-weight: 600; line-height: 1.5;
  }

  .tabsbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 6; margin-top: 18px; padding-block: 10px 12px; background: var(--bg); border-bottom: 1px solid var(--line); }
  .tabgroup { display: flex; align-items: center; gap: 12px; }
  .tabgroup + .tabgroup { margin-top: 8px; }
  .tglabel { flex: 0 0 92px; color: var(--muted); font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
  .tablist { display: flex; gap: 6px; min-width: 0; padding: 2px; overflow-x: auto; scrollbar-width: thin; }
  .tab {
    flex: 0 0 auto; padding: 8px 15px; border: 1px solid var(--line); border-radius: 999px; background: #fff; color: var(--ink);
    font-size: 13px; font-weight: 700; cursor: pointer; transition: background .15s, border-color .15s, color .15s;
  }
  .tab:hover { border-color: #C3CDDC; }
  .tab.empty { border-style: dashed; color: var(--muted); }
  .tab[aria-selected="true"] { background: var(--ink); border-color: var(--ink); color: #fff; }
  .lnk { padding: 4px 8px; border: 0; border-radius: 8px; background: transparent; color: var(--blue-ink); font-size: 12px; font-weight: 700; cursor: pointer; }
  .skip { margin: 18px 2px 0; color: var(--muted); font-size: 12px; line-height: 1.5; }

  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 680px), 1fr)); gap: 18px; min-width: 0; margin-top: 18px; }
  .card {
    min-width: 0; display: flex; flex-direction: column; gap: 10px;
    padding: 16px 14px 10px; border: 1px solid var(--line); border-radius: 22px; background: #fff;
    box-shadow: 0 1px 2px rgba(11,27,51,.04), 0 18px 40px -20px rgba(11,27,51,.16);
  }
  .chead { display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 10px 14px; padding-inline: 4px; }
  .ctitle { min-width: 0; flex: 1 1 260px; }
  .ctitle h2 { margin: 0; font-size: 15.5px; font-weight: 800; letter-spacing: -0.01em; line-height: 1.3; text-wrap: balance; }
  .ctitle p { margin: 3px 0 0; color: var(--muted); font-size: 12px; font-weight: 600; }
  .ctrl { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .seg { display: inline-flex; padding: 3px; border: 1px solid var(--line); border-radius: 999px; background: var(--tint); }
  .seg button {
    padding: 5px 12px; border: 0; border-radius: 999px; background: transparent; color: var(--muted);
    font-size: 12px; font-weight: 700; cursor: pointer;
  }
  .seg button[aria-pressed="true"] { background: #fff; color: var(--blue-ink); box-shadow: 0 1px 3px rgba(11,27,51,.14); }
  .tgl {
    padding: 6px 12px; border: 1px solid var(--line); border-radius: 999px; background: #fff; color: var(--muted);
    font-size: 12px; font-weight: 700; cursor: pointer;
  }
  .tgl[aria-pressed="true"] { border-color: var(--blue); background: var(--blue-tint); color: var(--blue-ink); }
  .tgl.dl { display: inline-flex; align-items: center; gap: 7px; color: var(--ink); }
  .tgl.dl:hover { border-color: var(--blue); color: var(--blue-ink); }
  .tgl.dl[data-busy] { pointer-events: none; color: var(--muted); }
  .legend { display: flex; flex-wrap: wrap; gap: 6px; padding-inline: 4px; }
  .chip {
    display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px 6px 10px;
    border: 1px solid var(--line); border-radius: 999px; background: #fff; color: var(--ink);
    font-size: 12px; font-weight: 600; line-height: 1; cursor: pointer; transition: opacity .15s, border-color .15s;
  }
  .chip:hover { border-color: #C3CDDC; }
  .chip.static { cursor: default; opacity: .6; }
  .chip.static:hover { border-color: var(--line); }
  .chip[aria-pressed="false"] { opacity: .4; }
  .chip small { color: var(--muted); font-size: 11.5px; font-weight: 600; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--c); }
  .dash { width: 18px; height: 0; border-top: 2px dashed var(--c); }
  .plot { position: relative; height: 460px; }
  .emptynote {
    position: absolute; left: 50%; top: 46%; transform: translate(-50%, -50%); display: grid; gap: 4px; justify-items: center;
    width: max-content; max-width: min(340px, 84%); padding: 12px 18px; border: 1px dashed var(--zero); border-radius: 14px;
    background: rgba(255,255,255,.94); text-align: center; pointer-events: none;
  }
  .emptynote strong { font-size: 13.5px; font-weight: 800; }
  .emptynote span { color: var(--muted); font-size: 12px; font-weight: 600; line-height: 1.45; }
  .tbl { max-height: 340px; overflow: auto; border: 1px solid var(--line); border-radius: 14px; }
  .tbl table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  .tbl th, .tbl td { padding: 7px 12px; border-bottom: 1px solid var(--grid); text-align: right; font-size: 12.5px; white-space: nowrap; }
  .tbl th:first-child, .tbl td:first-child { text-align: left; font-weight: 700; }
  .tbl thead th { position: sticky; top: 0; background: var(--tint); color: var(--muted); font-size: 11.5px; font-weight: 700; z-index: 1; }
  .tbl tfoot td { position: sticky; bottom: 0; background: var(--tint); font-weight: 800; border-bottom: 0; }

  .dwrap { display: grid; gap: 8px; min-width: 0; padding-inline: 2px; }
  .dblk { overflow-x: auto; border: 1px solid var(--line); border-radius: 14px; }
  .dblk table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  .dblk th, .dblk td { padding: 6px 10px; border-bottom: 1px solid var(--grid); text-align: right; font-size: 12px; white-space: nowrap; }
  .dblk th:first-child, .dblk td:first-child { text-align: left; font-weight: 700; position: sticky; left: 0; background: #fff; }
  .dblk thead th { background: var(--tint); color: var(--muted); font-size: 11.5px; font-weight: 700; }
  .dblk thead th:first-child { background: var(--tint); }
  .dblk tbody tr:last-child td { border-bottom: 0; }
  .dblk .avg { background: var(--tint); font-weight: 800; }
  .dsw { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 7px; background: var(--c); }

  .veil {
    position: fixed; inset: 0; z-index: 20; display: none; align-items: center; justify-content: center;
    background: rgba(255,255,255,.9); border: 3px dashed var(--blue); margin: 12px; border-radius: 24px;
    color: var(--blue-ink); font-size: 20px; font-weight: 800; pointer-events: none;
  }
  body.drag .veil { display: flex; }

  button:focus-visible, input:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
  @media (max-width: 900px) { .plot { height: 360px; } }
  @media (max-width: 700px) {
    .tabsbar { position: static; }
    .tabgroup { flex-wrap: wrap; gap: 4px; }
    .tglabel { flex: 1 0 100%; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="page">
  <header class="top">
    <div class="intro">
      <h1>PT. Lapi Laboratories</h1>
      <p class="lead"></p>
    </div>
    <div class="upload">
      <div class="file">
        <span class="fname" id="fname">Memuat contoh</span>
        <span class="badge" id="badge" hidden>Contoh</span>
        <span class="fmeta" id="fmeta"></span>
      </div>
      <input class="vh" type="file" id="file" accept=".xlsx,.xlsm" tabindex="-1">
      <button class="primary" id="pick" type="button">Unggah Excel</button>
    </div>
  </header>
  <p class="tip"></p>
  <div id="err" role="alert" hidden></div>

  <nav class="tabsbar" id="tabs" aria-label="Sheet Excel" hidden></nav>
  <main id="panels" aria-live="polite"></main>
  <p class="skip" id="skip"></p>
</div>

  function u16(d, o) { return d[o] | (d[o + 1] << 8); }

      var m = document.createElement('canvas').getContext('2d');
      var blocks = dataBlocks(ch), dfs = Math.round(11.5 * r), cpad = Math.round(10 * r), swD = Math.round(16 * r), rh = Math.round(26 * r), bgap = Math.round(10 * r);
      var fDB = '800 ' + dfs + 'px ' + T.font, fD = '600 ' + dfs + 'px ' + T.font, fDH = '700 ' + Math.round(11 * r) + 'px ' + T.font;
      var dHead = 'Data' + (ch.unit ? ' (' + ch.unit + ')' : '');
      m.font = fDB;
      var firstW = m.measureText(dHead).width + cpad * 2, colW = m.measureText('Rata-rata').width + cpad * 2, maxCols = 1;
      blocks.forEach(function (b) {
        maxCols = Math.max(maxCols, b.cols.length + (b.hasAvg ? 1 : 0));
        b.cols.forEach(function (c) { colW = Math.max(colW, m.measureText(c).width + cpad * 2); });
        b.rows.forEach(function (rw) {
          firstW = Math.max(firstW, swD + m.measureText(rw.name).width + cpad * 2);
          rw.vals.forEach(function (v) { colW = Math.max(colW, m.measureText(v).width + cpad * 2); });
          if (rw.avg != null) colW = Math.max(colW, m.measureText(rw.avg).width + cpad * 2);
        });
      });
      var cssW = Math.max(chart.width, 1000, Math.ceil((firstW + colW * maxCols) / r));
      chart.resize(cssW, Math.round(Math.max(chart.height, cssW * 0.4))); chart.update('none');
      r = src.width / chart.width;
      W = src.width + pad * 2; innerW = src.width;
      colW = (innerW - firstW) / maxCols;
      var dataH = bgap + blocks.reduce(function (sum, b) { return sum + (b.rows.length + 1) * rh; }, 0) + (blocks.length - 1) * bgap;
      var m = document.createElement('canvas').getContext('2d');
      var fTitle = '800 ' + Math.round(20 * r) + 'px ' + T.font, fSub = '600 ' + Math.round(12.5 * r) + 'px ' + T.font;
      var fLeg = '700 ' + Math.round(12.5 * r) + 'px ' + T.font, fFoot = '600 ' + Math.round(11.5 * r) + 'px ' + T.font;
      m.font = fTitle;
      var tLines = wrapText(m, ch.title, innerW), lh = Math.round(27 * r);

      var items = [];
      if (ch.series.length + ch.avgs.length > 1) {
        ch.series.forEach(function (s, i) { if (chart.isDatasetVisible(i)) items.push({ t: s.name, c: s.color, dash: false, x: '' }); });
        ch.avgs.forEach(function (a, j) {
          if (chart.isDatasetVisible(ch.series.length + j)) items.push({ t: a.name, c: a.color, dash: true, x: a.value == null ? '' : full(Math.round(a.value), ch.unit === 'Rp' ? 'Rp' : '') });
        });
      }
      m.font = fLeg;
      var rows = [[]], rowW = 0, gap = Math.round(22 * r), sw = Math.round(18 * r), sp = Math.round(8 * r);
      items.forEach(function (it) {
        it.w = sw + sp + m.measureText(it.t + (it.x ? '  ' + it.x : '')).width;
        if (rowW && rowW + gap + it.w > innerW) { rows.push([]); rowW = 0; }
        rows[rows.length - 1].push(it); rowW += (rowW ? gap : 0) + it.w;
      });
      var rowH = Math.round(26 * r), legH = items.length ? rows.length * rowH + sp : 0;
      var subH = Math.round(24 * r), footH = Math.round(34 * r);
      var H = pad + tLines.length * lh + subH + legH + src.height + dataH + footH;

      var cv = document.createElement('canvas'); cv.width = W; cv.height = H;
      var x = cv.getContext('2d');
      x.fillStyle = '#FFFFFF'; x.fillRect(0, 0, W, H);
      x.textBaseline = 'alphabetic';
      var y = pad;
      x.fillStyle = T.ink; x.font = fTitle;
      tLines.forEach(function (l, i) { x.fillText(l, pad, y + Math.round(20 * r) + i * lh); });
      y += tLines.length * lh;
      x.fillStyle = T.muted; x.font = fSub; x.fillText(ch.sub, pad, y + Math.round(14 * r));
      y += subH;
      if (items.length) {
        rows.forEach(function (row) {
          var lx = pad, base = y + Math.round(17 * r), cy = y + Math.round(12 * r);
          row.forEach(function (it) {
            x.strokeStyle = it.c; x.fillStyle = it.c;
            if (it.dash) {
              x.lineWidth = Math.round(2 * r); x.setLineDash([Math.round(5 * r), Math.round(4 * r)]);
              x.beginPath(); x.moveTo(lx, cy); x.lineTo(lx + sw, cy); x.stroke(); x.setLineDash([]);
            } else { x.beginPath(); x.arc(lx + Math.round(6 * r), cy, Math.round(5 * r), 0, Math.PI * 2); x.fill(); }
            var tx = lx + sw + sp;
            x.font = fLeg; x.fillStyle = T.ink; x.fillText(it.t, tx, base);
            if (it.x) { x.fillStyle = T.muted; x.fillText(it.x, tx + x.measureText(it.t + '  ').width, base); }
            lx += it.w + gap;
          });
          y += rowH;
        });
        y += sp;
      }
      x.drawImage(src, pad, y); y += src.height + bgap;
      chart.resize();
      blocks.forEach(function (b, bi) {
        var bh = (b.rows.length + 1) * rh, rr = Math.round(10 * r), nc = b.cols.length, k, i;
        x.save(); pill(x, pad, y, innerW, bh, rr); x.clip();
        x.fillStyle = '#F6F8FB'; x.fillRect(pad, y, innerW, rh);
        if (b.hasAvg) x.fillRect(pad + firstW + colW * nc, y + rh, colW, bh - rh);
        x.strokeStyle = '#EDF1F6'; x.lineWidth = Math.max(1, Math.round(r));
        for (i = 1; i < b.rows.length + 1; i++) { x.beginPath(); x.moveTo(pad, y + i * rh); x.lineTo(pad + innerW, y + i * rh); x.stroke(); }
        x.textBaseline = 'middle';
        x.font = fDH; x.fillStyle = T.muted; x.textAlign = 'left';
        x.fillText(dHead, pad + cpad, y + rh / 2);
        x.textAlign = 'right';
        for (k = 0; k < nc; k++) x.fillText(b.cols[k], pad + firstW + colW * (k + 1) - cpad, y + rh / 2);
        if (b.hasAvg) x.fillText('Rata-rata', pad + firstW + colW * (nc + 1) - cpad, y + rh / 2);
        b.rows.forEach(function (rw, ri) {
          var cy = y + (ri + 1) * rh + rh / 2;
          x.fillStyle = rw.color; x.beginPath(); x.arc(pad + cpad + Math.round(4 * r), cy, Math.round(4 * r), 0, Math.PI * 2); x.fill();
          x.textAlign = 'left'; x.font = fDB; x.fillStyle = T.ink; x.fillText(rw.name, pad + cpad + swD, cy);
          x.textAlign = 'right'; x.font = fD;
          for (k = 0; k < nc; k++) x.fillText(rw.vals[k], pad + firstW + colW * (k + 1) - cpad, cy);
          if (b.hasAvg) { x.font = fDB; x.fillText(rw.avg, pad + firstW + colW * (nc + 1) - cpad, cy); }
        });
        x.restore();
        x.strokeStyle = '#E2E8F0'; x.lineWidth = Math.max(1, Math.round(r));
        pill(x, pad, y, innerW, bh, rr); x.stroke();
        y += bh + (bi < blocks.length - 1 ? bgap : 0);
      });
      x.textAlign = 'left'; x.textBaseline = 'alphabetic';
      var date = new Date().toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' });
      x.fillStyle = T.muted; x.font = fFoot;
      x.fillText('Sumber: ' + document.getElementById('fname').textContent + '  ·  ' + date, pad, y + Math.round(20 * r));
      return new Promise(function (res, rej) {
        cv.toBlob(function (b) { if (b) res(b); else rej(new Error('Gambar gagal dibuat.')); }, 'image/png');
      });
    });
  }
  function anchorSave(blob, name) {
    var url = URL.createObjectURL(blob), a = document.createElement('a');
    a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
  }
  function exportCard(card, btn) {
    if (!card.chart || btn.hasAttribute('data-busy')) return;
    btn.setAttribute('data-busy', '1'); setDlText(btn, 'Menyiapkan…');
    composePng(card).then(function (blob) {
      var name = fileSlug(card.ch.title) + '.png';
      if (DL.kind === 'cap') return DL.api.save({ filename: name, data: blob });
      anchorSave(blob, name);
    }).then(function () {
      flashDl(btn, 'Tersimpan');
    }, function (e) {
      var code = e && e.code;
      if (code === 'declined') flashDl(btn, null);
      else if (code === 'rate_limited') flashDl(btn, 'Tunggu sebentar');
      else if (['unavailable', 'not_granted', 'capability_disabled', 'capability_removed', 'extension_not_enabled'].indexOf(code) >= 0) { flashDl(btn, null); DL.kind = null; syncAllDl(); }
      else flashDl(btn, 'Gagal, coba lagi');
    });
  }

  function setMode(card, mode) {
    card.st.mode = mode;
    Object.keys(card.segBtns).forEach(function (k) { card.segBtns[k].setAttribute('aria-pressed', k === mode ? 'true' : 'false'); });
    card.lbl.setAttribute('aria-pressed', card.st.labels ? 'true' : 'false');
    card.lbl.hidden = mode === 'table';
    card.legend.hidden = mode === 'table';
    syncDl(card);
    if (card.chart) { card.chart.destroy(); card.chart = null; }
    if (mode === 'table') {
      card.plot.hidden = true;
      if (card.data) card.data.hidden = true;
      if (!card.tbl) { card.tbl = buildTable(card); card.appendChild(card.tbl); }
      card.tbl.hidden = false;
      return;
    }
    if (card.tbl) card.tbl.hidden = true;
    card.plot.hidden = false;
    if (card.data) card.data.hidden = false;
    card.chart = makeChart(card);
  }

  var tabsEl = document.getElementById('tabs'), panelsEl = document.getElementById('panels'), skipEl = document.getElementById('skip');
  var panels = {}, activeName = null;

  function clearAll() {
    Object.keys(panels).forEach(function (k) { panels[k].cards.forEach(function (c) { if (c.chart) c.chart.destroy(); }); });
    panels = {}; tabsEl.textContent = ''; panelsEl.textContent = ''; skipEl.textContent = ''; tabsEl.hidden = true;
  }
  function setErr(msg) {
    var e = document.getElementById('err');
    e.hidden = !msg; e.textContent = msg || '';
  }
  function activate(name) {
    activeName = name;
    Object.keys(panels).forEach(function (k) {
      var p = panels[k], on = k === name;
      p.el.hidden = !on;
      p.tab.setAttribute('aria-selected', on ? 'true' : 'false');
      p.tab.tabIndex = on ? 0 : -1;
    });
    var p = panels[name];
    if (!p) return;
    if (!p.built) { p.built = true; p.cards.forEach(function (c) { setMode(c, c.st.mode); }); }
    else p.cards.forEach(function (c) { if (c.chart) c.chart.resize(); });
  }

  function render(model, fileName, isSample) {
    clearAll(); setErr('');
    document.getElementById('fname').textContent = fileName;
    document.getElementById('badge').hidden = !isSample;
    var real = 0, tmpl = 0;
    model.sheets.forEach(function (s) { s.charts.forEach(function (c) { if (c.empty) tmpl++; else real++; }); });
    if (!real && !tmpl) {
      document.getElementById('fmeta').textContent = '';
      setErr('Belum ada tabel yang bisa dibaca dari file ini. Tabel perlu punya baris judul kolom, satu kolom nama periode (misalnya bulan atau minggu), dan kolom angka di sebelahnya.' +
        (model.skipped.length ? ' Sheet yang dilewati: ' + model.skipped.join(', ') + '.' : ''));
      return;
    }
    var parts = [];
    if (real) parts.push(real + ' grafik');
    if (tmpl) parts.push(tmpl + ' template kosong');
    document.getElementById('fmeta').textContent = parts.join(' · ');

    var groups = [], gmap = {};
    model.sheets.forEach(function (sh) {
      if (!gmap[sh.period]) { gmap[sh.period] = { label: sh.period, sheets: [] }; groups.push(gmap[sh.period]); }
      gmap[sh.period].sheets.push(sh);
    });
    groups.forEach(function (gr) {
      var row = el('div', 'tabgroup');
      if (groups.length > 1) row.appendChild(el('span', 'tglabel', gr.label));
      var list = el('div', 'tablist');
      list.setAttribute('role', 'tablist'); list.setAttribute('aria-label', gr.label);
      gr.sheets.forEach(function (sh) {
        var tab = el('button', 'tab' + (sh.empty ? ' empty' : ''), sh.name);
        tab.type = 'button'; tab.setAttribute('role', 'tab');
        if (sh.empty) tab.title = 'Belum ada data';
        var panel = el('section', 'grid');
        panel.setAttribute('role', 'tabpanel'); panel.hidden = true;
        var arr = sh.charts.map(function (ch) { var card = createCard(ch); panel.appendChild(card); return card; });
        panels[sh.name] = { el: panel, tab: tab, cards: arr, built: false };
        tab.addEventListener('click', function () { activate(sh.name); });
        list.appendChild(tab); panelsEl.appendChild(panel);
      });
      row.appendChild(list); tabsEl.appendChild(row);
    });
    tabsEl.hidden = false;
    if (model.skipped.length) skipEl.textContent = 'Dilewati karena tidak ada tabel: ' + model.skipped.join(', ') + '.';
    var first = model.sheets.filter(function (s) { return !s.empty; })[0] || model.sheets[0];
    activate(activeName && panels[activeName] ? activeName : first.name);
  }

  /* =====================================================================
     6. Memuat file
     ===================================================================== */
  async function loadBuffer(buf, name, isSample) {
    try {
      document.getElementById('fmeta').textContent = 'Membaca file…';
      var model = analyze(await readWorkbook(buf));
      render(model, name, isSample);
    } catch (e) {
      clearAll();
      document.getElementById('fname').textContent = name;
      document.getElementById('badge').hidden = !isSample;
      document.getElementById('fmeta').textContent = '';
      setErr(e && e.message ? e.message : 'File tidak bisa dibaca.');
    }
  }
  async function handleFile(f) {
    if (!/\.(xlsx|xlsm)$/i.test(f.name)) {
      setErr('Format ' + (f.name.split('.').pop() || 'ini') + ' belum bisa dibaca. Buka di Excel, pilih Save As, lalu simpan sebagai .xlsx.');
      document.getElementById('fname').textContent = f.name;
      document.getElementById('badge').hidden = true;
      return;
    }
    loadBuffer(await f.arrayBuffer(), f.name, false);
  }

  var fileIn = document.getElementById('file');
  document.getElementById('pick').addEventListener('click', function () { fileIn.click(); });
  fileIn.addEventListener('change', function () { if (fileIn.files[0]) handleFile(fileIn.files[0]); fileIn.value = ''; });
  window.addEventListener('dragover', function (e) { e.preventDefault(); document.body.classList.add('drag'); });
  window.addEventListener('dragenter', function (e) { e.preventDefault(); document.body.classList.add('drag'); });
  window.addEventListener('dragleave', function (e) { if (!e.relatedTarget) document.body.classList.remove('drag'); });
  window.addEventListener('drop', function (e) {
    e.preventDefault(); document.body.classList.remove('drag');
    var f = e.dataTransfer && e.dataTransfer.files[0];
    if (f) handleFile(f);
  });
  tabsEl.addEventListener('keydown', function (e) {
    if (['ArrowLeft', 'ArrowRight', 'Home', 'End'].indexOf(e.key) < 0) return;
    var all = Array.prototype.slice.call(tabsEl.querySelectorAll('.tab')), i = all.indexOf(document.activeElement);
    if (i < 0) return;
    e.preventDefault();
    var j = e.key === 'Home' ? 0 : e.key === 'End' ? all.length - 1 : (i + (e.key === 'ArrowRight' ? 1 : -1) + all.length) % all.length;
    all[j].click(); all[j].focus();
  });

  if (typeof Chart === 'undefined' || typeof ChartDataLabels === 'undefined') {
    setErr('Pustaka grafik tidak bisa dimuat. Pastikan komputer terhubung ke internet lalu muat ulang halaman.');
    return;
  }
  Chart.register(ChartDataLabels);
  Chart.defaults.font.family = T.font;
  Chart.defaults.color = T.muted;
  detectDownloads().then(syncAllDl);

  (function () {
    var bin = atob(SAMPLE_B64), buf = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
    loadBuffer(buf.buffer, SAMPLE_NAME, true);
  })();
})();
</script>
